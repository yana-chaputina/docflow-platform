databaseChangeLog:
  - changeSet:
      id: 2
      author: iana
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(250)

        - sql:
            dbms: 'postgresql'
            sql: ALTER TABLE roles ADD CONSTRAINT chk_roles_name CHECK (name IN ('USER', 'MANAGER', 'ADMIN'))
            rollback:
              - sql:
                  sql: ALTER TABLE roles DROP CONSTRAINT chk_roles_name