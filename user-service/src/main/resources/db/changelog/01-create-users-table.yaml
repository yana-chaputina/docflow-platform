databaseChangeLog:
  - changeSet:
      id: 1
      author: iana
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(250)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(250)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

        - sql:
            dbms: 'postgresql'
            sql: ALTER TABLE users ADD CONSTRAINT chk_users_status CHECK (status IN ('ACTIVE', 'BLOCKED', 'DELETED'))
            rollback:
              - sql:
                  sql: ALTER TABLE users DROP CONSTRAINT chk_users_status

        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_status
            tableName: users
            columns:
              - column:
                  name: status