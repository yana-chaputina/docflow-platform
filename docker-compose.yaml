services:
  postgres-user:
    image: 'postgres:18.6-alpine'
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: usersecret
    ports:
      - '5432:5432'
    volumes:
      - postgres_user_data:/var/lib/postgresql/18/data
    networks:
      - app-network

  postgres-order:
    image: 'postgres:18.6-alpine'
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: usersecret
    ports:
      - '5433:5432'
    volumes:
      - postgres_order_data:/var/lib/postgresql/18/data
    networks:
      - app-network

  postgres-notification:
    image: 'postgres:18.6-alpine'
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: usersecret
    ports:
      - '5434:5432'
    volumes:
      - postgres_notification_data:/var/lib/postgresql/18/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres-user
      - postgres-order
      - postgres-notification
    networks:
      - app-network

  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  postgres_user_data:
  postgres_order_data:
  postgres_notification_data:

networks:
  app-network:
    driver: bridge