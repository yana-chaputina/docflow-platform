databaseChangeLog:
  - changeSet:
      id: 2
      author: iana
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: status_history
      changes:
        - createTable:
            tableName: status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: old_status
                  type: VARCHAR(30)
              - column:
                  name: new_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_status_history_order_id
            baseTableName: status_history
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_status_history_order_id
            tableName: status_history
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_status_history_changed_at
            tableName: status_history
            columns:
              - column:
                  name: changed_at