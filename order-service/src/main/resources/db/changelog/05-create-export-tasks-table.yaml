databaseChangeLog:
  - changeSet:
      id: 5
      author: iana
      changes:
        - createTable:
            tableName: export_tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: file_url
                  type: VARCHAR(500)
              - column:
                  name: error_message
                  type: VARCHAR(255)
              - column:
                  name: requested_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP


        - sql:
            dbms: 'postgresql'
            sql: ALTER TABLE export_tasks ADD CONSTRAINT chk_export_task_status CHECK (status IN ('PENDING','PROCESSING','DONE', 'FAILED'))
            rollback:
              - sql:
                  sql: ALTER TABLE export_tasks DROP CONSTRAINT chk_export_task_status


        - createIndex:
            indexName: idx_export_tasks_user_id
            tableName: export_tasks
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_export_tasks_status
            tableName: export_tasks
            columns:
              - column:
                  name: status